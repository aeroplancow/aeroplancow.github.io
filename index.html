<!DOCTYPE html>
<html>

<head>
<title>TFD</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="descirption" content="Creative Direction and Design">

<meta property="og:title" content="TAXFREEDESIGN">
<meta property="og:description" content="London-Rotterdam-Novi Sad">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="main">

<header>
    <a href="https://lukakustudic.com/" 
       target="_blank"
       data-image="images/london.jpg">London -</a>

    <a href="index_k.html" 
       target="_blank"
       data-image="images/rotterdam.jpg">Rotterdam -</a>

    <a href="https://nemanjakarisic.com/" 
       target="_blank"
       data-image="images/novi-sad.jpg">Novi Sad</a>
</header>

</div>


<div class="image-preview">
    <img src="" alt="">
</div>


<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>

<script>

$(document).ready(function() {

    $('header a').hover(function() {

        var image = $(this).data('image');

        $('.image-preview img')
            .attr('src', image)
            .fadeIn(150);

    }, function() {

        $('.image-preview img')
            .fadeOut(150);

    });

});

</script>

</body>
</html>
